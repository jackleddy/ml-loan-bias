[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virginia-loan-fairness"
version = "0.1.0"
description = "Historical Virginia mortgage pricing and demographic residual analysis"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4", "pyarrow>=17,<24", "pyshp>=2.3,<4",
  "scipy>=1.12,<2", "statsmodels>=0.14,<1", "matplotlib>=3.9,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["loanfair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
